services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kakitangan
      POSTGRES_PASSWORD: kakitangan
      POSTGRES_DB: kakitangan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kakitangan -d kakitangan"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
